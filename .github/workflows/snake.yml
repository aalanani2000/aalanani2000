name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Platane/snk v3.5.0 (pinned to exact commit)
      - uses: Platane/snk@a041d6c27ba561a39f5be9c26a784812765e434b
        id: snake-generate
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push generated SVGs to the output branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote --exit-code --heads "$REMOTE" output >/dev/null 2>&1; then
            git clone --single-branch --branch output "$REMOTE" output-repo
          else
            git init -b output output-repo
            git -C output-repo remote add origin "$REMOTE"
          fi

          echo "--- dist contents ---"
          ls -la dist/

          cp dist/github-snake.svg dist/github-snake-dark.svg output-repo/

          git -C output-repo add -A
          git -C output-repo commit -m "chore: update contribution snake [skip ci]" || echo "nothing to commit"
          git -C output-repo push -u origin output
