name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Platane/snk v3.5.0 (pinned to exact commit)
      - uses: Platane/snk@a041d6c27ba561a39f5be9c26a784812765e434b
        id: snake-generate
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push generated SVGs to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git clone --single-branch --branch output "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" output-repo
          else
            git init -b output output-repo
            cd output-repo
            git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          fi

          cp dist/github-snake.svg dist/github-snake-dark.svg output-repo/ 2>/dev/null || \
          cp ../dist/github-snake.svg ../dist/github-snake-dark.svg output-repo/ 2>/dev/null || true

          cd output-repo
          git add -A
          git commit -m "chore: update contribution snake [skip ci]" 2>/dev/null || echo "no changes"
          git push -u origin output
